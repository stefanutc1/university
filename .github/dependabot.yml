# Dependabot Configuration for Projects-FEAA-UCV/proiecte Monorepo
version: 2
updates:
  # 1. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5

  # 2. Java / Maven Backend (Spring Boot 3.2)
  - package-ecosystem: "maven"
    directory: "/licenta/LL3-LucrareLicenta/code/web/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5

  # 3. Python Simulators & Testing Harness
  - package-ecosystem: "pip"
    directory: "/licenta/LL3-LucrareLicenta/code"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5

  # 4. Next.js 15 Web Application (PS2 Practica)
  - package-ecosystem: "npm"
    directory: "/licenta/PS2-Practica/proiect"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
