name: CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'LL3-LucrareLicenta/**'
  workflow_dispatch:
    inputs:
      deploy_licenta_release:
        description: 'Publish Licenta Compiled PDF Release'
        required: true
        type: boolean
        default: true

concurrency:
  group: master-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  licenta-sync-cd:
    name: "Sincronizare LaTeX si generare PDF"
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_licenta_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc & LaTeX Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-european \
            texlive-bibtex-extra \
            biber \
            latexmk

      - name: Construire surse LaTeX
        run: |
          cd LL3-LucrareLicenta
          mkdir -p latex_generated
          DOCX_FILE=$(find . -maxdepth 1 -name "*.docx" | head -n 1)
          
          if [ -n "$DOCX_FILE" ]; then
            pandoc "$DOCX_FILE" \
              --from=docx \
              --to=latex \
              --standalone \
              --natbib \
              --extract-media=./latex_generated/media \
              -o ./latex_generated/licenta.tex
              
            [ ! -f ./latex_generated/referinte.bib ] && touch ./latex_generated/referinte.bib
            
            cd latex_generated
            latexmk -pdf -interaction=nonstopmode -halt-on-error licenta.tex || true
            cd ../..
          fi

      - name: Commit Generated LaTeX to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add LL3-LucrareLicenta/latex_generated/
          if ! git diff --cached --quiet; then
            git commit -m "cd: auto-sync latex files for LL3-LucrareLicenta [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nicio modificare in fisierele LaTeX."
          fi

      - name: Publica release
        uses: softprops/action-gh-release@v2
        if: env.PDF_EXISTS == 'true'
        env:
          PDF_EXISTS: ${{ hashFiles('LL3-LucrareLicenta/latex_generated/*.pdf') != '' }}
        with:
          tag_name: licenta-latest
          name: "Licență - Ultimul Build PDF"
          body: "Compilat automat din commit-ul: `${{ github.sha }}`"
          files: LL3-LucrareLicenta/latex_generated/*.pdf
          draft: false
          prerelease: true
