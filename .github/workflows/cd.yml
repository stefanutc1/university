name: DAM3 CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Build and publish Web Docker image'
        required: true
        type: boolean
        default: true
      build_desktop_release:
        description: 'Build Desktop release artifacts'
        required: true
        type: boolean
        default: true

concurrency:
  group: dam3-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-publish-cd:
    name: Build & Push Docker Container Image
    if: github.event_name != 'workflow_dispatch' || inputs.publish_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase for Docker tag
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: DAM3-Proiect
          file: DAM3-Proiect/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/dam3-web:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/dam3-web:${{ github.sha }}

  release-desktop-cd:
    name: Build Desktop Release Package
    if: github.event_name != 'workflow_dispatch' || inputs.build_desktop_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create dummy native lib for build
        run: |
          mkdir -p packages/quant-engine/build/lib/
          touch packages/quant-engine/build/lib/libquantengine.so

      - name: Publish Desktop Standalone Binary (Linux x64)
        run: |
          dotnet publish apps/desktop/EloquenceSoftware.csproj -c Release -r linux-x64 --self-contained -o dist/desktop-linux

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dam3-desktop-linux-x64
          path: DAM3-Proiect/dist/desktop-linux
