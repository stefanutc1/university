name: DAM3 CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'DAM3-Proiect/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy Web app to GitHub Pages'
        required: true
        type: boolean
        default: true
      publish_docker:
        description: 'Publish Web Docker image to GHCR'
        required: true
        type: boolean
        default: true
      build_desktop:
        description: 'Build Desktop release bundle'
        required: true
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Web App to GitHub Pages
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: DAM3-Proiect/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static Export for GitHub Pages
        run: |
          cd apps/web
          DEPLOY_TARGET=gh-pages GITHUB_PAGES=true NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npx next build
          mkdir -p out
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: DAM3-Proiect/apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-publish:
    name: Build & Push Docker Image to GHCR
    if: github.event_name != 'workflow_dispatch' || inputs.publish_docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase for Docker tag
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: DAM3-Proiect
          file: DAM3-Proiect/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/dam3-web:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/dam3-web:${{ github.sha }}

  release-desktop:
    name: Build Desktop Release Binary
    if: github.event_name != 'workflow_dispatch' || inputs.build_desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create dummy native lib for build
        run: |
          mkdir -p packages/quant-engine/build/lib/
          touch packages/quant-engine/build/lib/libquantengine.dylib
          touch packages/quant-engine/build/lib/libquantengine.so

      - name: Publish Desktop Standalone (Linux x64)
        run: |
          dotnet publish apps/desktop/EloquenceSoftware.csproj -c Release -r linux-x64 --self-contained -o dist/desktop-linux

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dam3-desktop-linux-x64
          path: DAM3-Proiect/dist/desktop-linux
