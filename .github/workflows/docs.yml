name: Academic Documentation & Parity

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - *.docx'
      - 'licenta/LL3-LucrareLicenta/latex/**'
      - 'scripts/sync_academic_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '**/*.md'
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - *.docx'
      - 'licenta/LL3-LucrareLicenta/latex/**'
      - 'scripts/sync_academic_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: monorepo-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  academic-documentation:
    name: "Validate Parity & Documentation Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for parity check
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install python-docx
        run: pip install python-docx

      - name: Verify DOCX <-> LaTeX parity
        run: |
          python3 scripts/sync_academic_docs.py --verify

      - name: Run Repository Health Doctor in Quick Check Mode
        run: |
          python3 scripts/doctor.py --summary

      - name: Academic Documentation Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## Monorepo Academic Documentation & Parity Summary

          | Asset | Format | Verification Status | Artifact |
          | :--- | :--- | :---: | :---: |
          | **Original Academic Documents** | DOCX (`LUCRARE LICENTA - *.docx`) | VERIFIED | Source Document |
          | **Modular LaTeX Structure** | TeX / BibTeX (`latex/main.tex`) | PARITY OK | Version Controlled |
          | **Repository Governance** | Markdown & Catalog Standards | COMPLIANT | Documentation |

          *Documentația academică respectă întocmai normele de paritate și standardele FEAA UCV.*
          EOF
