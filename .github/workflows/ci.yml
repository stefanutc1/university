name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'LL3-LucrareLicenta/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'LL3-LucrareLicenta/**'
  workflow_dispatch:

concurrency:
  group: licenta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenta-ci:
    name: "Converteste DOCX si valideaza LaTeX"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LL3-LucrareLicenta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc & LaTeX Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-european \
            texlive-bibtex-extra \
            biber \
            latexmk

      - name: Converteste DOCX in LaTeX & BiBTeX
        run: |
          mkdir -p output
          DOCX_FILE=$(find . -maxdepth 1 -name "*.docx" | head -n 1)
          
          if [ -n "$DOCX_FILE" ]; then
            echo "Gasit DOCX: $DOCX_FILE"
            pandoc "$DOCX_FILE" \
              --from=docx \
              --to=latex \
              --standalone \
              --natbib \
              --extract-media=./output/media \
              -o ./output/licenta.tex
              
            if [ ! -f ./output/referinte.bib ]; then
              touch ./output/referinte.bib
            fi
          elif [ -f "./licenta.tex" ]; then
            cp -r ./*.tex ./output/
            [ -f "./referinte.bib" ] && cp ./referinte.bib ./output/
          else
            echo "Fisier de intrare absent."
            exit 1
          fi

      - name: Compile LaTeX to PDF
        run: |
          cd output
          if [ -f licenta.tex ]; then
            latexmk -pdf -interaction=nonstopmode -halt-on-error licenta.tex || true
          fi

      - name: Pune artifacts la licenta
        uses: actions/upload-artifact@v4
        with:
          name: licenta-bundle
          path: |
            LL3-LucrareLicenta/output/*.pdf
            LL3-LucrareLicenta/output/*.tex
            LL3-LucrareLicenta/output/*.bib
            LL3-LucrareLicenta/output/media/
          retention-days: 7
