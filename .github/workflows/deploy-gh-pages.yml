name: Deploy Banking Kiosk to GitHub Pages

on:
  workflow_run:
    workflows: [ "LL3 Continuous Integration & Quality Gates" ]
    types: [ completed ]
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy Static Kiosk to GitHub Pages"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Web Frontend Assets Integrity
        run: |
          echo "[CHECK] Verificare integritate fisiere inainte de publicare..."
          test -f licenta/LL3-LucrareLicenta/code/web/index.html || { echo "Eroare: Lipsește index.html"; exit 1; }
          test -f licenta/LL3-LucrareLicenta/code/web/css/kiosk.css || { echo "Eroare: Lipsește kiosk.css"; exit 1; }
          echo "[SUCCESS] Verificare integritate finalizată cu succes."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'licenta/LL3-LucrareLicenta/code/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
