name: Web Application CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify Web Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DAM3-Proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: DAM3-Proiect/package-lock.json

      - name: Install Monorepo Dependencies
        run: |
          npm install
          cd apps/web && npm install

      - name: Typecheck Web App
        run: |
          cd apps/web
          npx tsc --noEmit

      - name: Build Next.js Web App
        run: |
          cd apps/web
          npm run build
