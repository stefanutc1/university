name: LL3 Academic Documentation (DOCX & LaTeX)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - *.docx'
      - 'licenta/LL3-LucrareLicenta/latex/**'
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - */**'
      - 'scripts/sync_academic_docs.py'
      - '.github/workflows/ll3-docs.yml'
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - *.docx'
      - 'licenta/LL3-LucrareLicenta/latex/**'
      - 'licenta/LL3-LucrareLicenta/LUCRARE LICENTA - */**'
      - 'scripts/sync_academic_docs.py'
      - '.github/workflows/ll3-docs.yml'
  workflow_dispatch:

concurrency:
  group: ll3-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  academic-documentation:
    name: "Validate Parity & Compile LaTeX PDF"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for parity check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-docx
        run: pip install python-docx

      - name: Verify DOCX <-> LaTeX parity
        run: |
          python3 scripts/sync_academic_docs.py --verify

      - name: Compile LaTeX Lucrare de Licență to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: licenta/LL3-LucrareLicenta/latex
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Verify generated PDF document
        run: |
          PDF_PATH="licenta/LL3-LucrareLicenta/latex/main.pdf"
          if [ -f "$PDF_PATH" ]; then
            SIZE=$(du -h "$PDF_PATH" | cut -f1)
            echo "[SUCCESS] PDF-ul lucrării de licență a fost generat cu succes ($SIZE)."
            cp "$PDF_PATH" "licenta/LL3-LucrareLicenta/LUCRARE_LICENTA_2026.pdf"
          else
            echo "[EROARE CRITICĂ] Fișierul PDF nu a fost produs în timpul compilării LaTeX!"
            exit 1
          fi

      - name: Upload compiled Licență PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenta-pdf
          path: licenta/LL3-LucrareLicenta/LUCRARE_LICENTA_2026.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Academic Documentation Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## LL3 Academic Documentation Build & Parity Summary

          | Asset | Format | Verification Status | Artifact |
          | :--- | :--- | :---: | :---: |
          | **Original Academic Document** | DOCX (`LUCRARE LICENTA - 31.08.2026.docx`) | VERIFIED | Source Document |
          | **Modular LaTeX Structure** | TeX / BibTeX (`latex/main.tex`) | PARITY OK | Version Controlled |
          | **Compiled Academic Thesis** | PDF (TeXLive Engine) | COMPILED | `licenta-pdf` (30 days) |

          *Documentația academică respectă întocmai structura cerută de Facultatea de Economie și Administrarea Afacerilor (FEAA), Universitatea din Craiova.*
          EOF
