name: DevSecOps & Security Scanning

on:
  push:
    branches: [ main, master ]
    paths:
      - 'licenta/LL3-LucrareLicenta/**'
      - 'licenta/PS2-Practica/**'
      - '.github/workflows/security.yml'
      - '.gitleaks.toml'
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'licenta/LL3-LucrareLicenta/**'
      - 'licenta/PS2-Practica/**'
      - '.github/workflows/security.yml'
      - '.gitleaks.toml'
  workflow_dispatch:

concurrency:
  group: monorepo-sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scanning:
    name: "Gitleaks & TruffleHog Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

      - name: Run TruffleHog OSS credential verification
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --exclude-paths=.gitleaks.toml
        continue-on-error: true

  python-dependency-audit:
    name: "Python Vulnerability Audit (pip-audit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licenta/LL3-LucrareLicenta/code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'licenta/LL3-LucrareLicenta/code/requirements.txt'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit requirements.txt for known vulnerabilities
        run: |
          pip-audit -r requirements.txt || true

  npm-dependency-audit:
    name: "Node.js Vulnerability Audit (npm audit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licenta/PS2-Practica/proiect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true

  bandit-sast:
    name: "Python SAST Static Analysis (Bandit)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licenta/LL3-LucrareLicenta/code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit SAST scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          echo "[SAST] Scanare statică a codului Python bancar cu Bandit..."
          bandit -r . -ll -x "./tests,./venv" || true

  semgrep-sast:
    name: "Semgrep Multi-Stack SAST Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep OSS Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
        continue-on-error: true

  trivy-scan:
    name: "Trivy Vulnerability & Misconfig Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on monorepo
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

  sbom-generation:
    name: "Generate Software Bill of Materials (SBOM)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate CycloneDX SBOM for Java Backend
        working-directory: licenta/LL3-LucrareLicenta/code/web/backend
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DskipTests=true || true

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-sbom-cyclonedx
          path: |
            licenta/LL3-LucrareLicenta/code/web/backend/target/bom.json
            licenta/LL3-LucrareLicenta/code/web/backend/target/bom.xml
          if-no-files-found: warn
          retention-days: 14

  security-gate:
    name: "DevSecOps Security Quality Gate"
    needs: [ secret-scanning, python-dependency-audit, npm-dependency-audit, bandit-sast, semgrep-sast, trivy-scan, sbom-generation ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate security findings
        run: |
          echo "Secret Scanning Status: ${{ needs.secret-scanning.result }}"
          echo "Python Dependency Audit: ${{ needs.python-dependency-audit.result }}"
          echo "NPM Dependency Audit: ${{ needs.npm-dependency-audit.result }}"
          echo "SAST Bandit Status: ${{ needs.bandit-sast.result }}"
          echo "Semgrep Status: ${{ needs.semgrep-sast.result }}"
          echo "Trivy Scan Status: ${{ needs.trivy-scan.result }}"
          echo "SBOM Status: ${{ needs.sbom-generation.result }}"

          if [ "${{ needs.secret-scanning.result }}" == "failure" ] && [ "${{ secrets.STRICT_SECURITY_GATE }}" == "true" ]; then
            echo "[BLOCKING ERROR] Secrete sau chei private detectate în commit!"
            exit 1
          fi
          echo "[SUCCESS] Poarta DevSecOps a validat toate controalele de securitate."

      - name: Generate DevSecOps Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## Monorepo DevSecOps & Security Gate Summary

          | Security Control | Scanner Tool | Blocking Policy | Execution Status |
          | :--- | :--- | :---: | :---: |
          | **Secret Detection** | Gitleaks v2 & TruffleHog | BLOCKING | ${{ needs.secret-scanning.result }} |
          | **Python Dependencies** | pip-audit (CVE Database) | AUDIT / REPORT | ${{ needs.python-dependency-audit.result }} |
          | **Node Dependencies** | npm audit (Advisories) | AUDIT / REPORT | ${{ needs.npm-dependency-audit.result }} |
          | **Python SAST** | Bandit Security Scanner | AUDIT / REPORT | ${{ needs.bandit-sast.result }} |
          | **Multi-Stack SAST** | Semgrep (OWASP Top 10) | AUDIT / REPORT | ${{ needs.semgrep-sast.result }} |
          | **FS & Config Scan** | Aqua Trivy | AUDIT / REPORT | ${{ needs.trivy-scan.result }} |
          | **Supply Chain SBOM** | CycloneDX (Maven plugin) | ARTIFACT | ${{ needs.sbom-generation.result }} |

          *Controale de securitate auditate conform politicii stefanutc1/proiecte.*
          EOF
