    <H1>Exemplu de tabel HTML (Sectiunea 4)</H1>
    <P>Urmatorul tabel demonstreaza utilizarea elementelor TABLE, CAPTION, TBODY, TR, TH si TD cu atributul BORDER="2":</P>

    <TABLE BORDER ="2">
        <CAPTION>Tabelul</CAPTION>
        <TBODY>
            <TR>
                <TH>1</TH>
                <TH>2</TH>
            </TR>
            <TR>
                <TD>1</TD>
                <TD>2</TD>
            </TR>
            <TR>
                <TD>Linie</TD>
                <TD>Linie</TD>
            </TR>
        </TBODY>
        <TBODY>
            <TR>
                <TD>Alta linie</TD>
            </TR>
        </TBODY>
    </TABLE>

    <HR>
    <P><SMALL>Laborator 1 - Exemplul 2 (Sectiunea 4: Formatarea textului in HTML - Tabele)</SMALL></P>
</BODY>
</HTML>
